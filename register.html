<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | SmartClass</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
<header><nav class="navbar login-navbar"><a class="logo" href="login.html">Smart<span>Class</span></a></nav></header>
<main class="login-container">
  <div class="login-card">
    <div class="login-logo">🎓</div>
    <p class="tag">SMART CLASSROOM</p>
    <h1>Create Account</h1>
    <p class="login-subtitle">Register to save your classroom details and submit feedback.</p>
    <form id="registerForm">
      <label>Full Name<input id="registerName" type="text" maxlength="100" placeholder="Enter your full name" required></label>
      <label>Email Address<input id="registerEmail" type="email" maxlength="190" placeholder="Enter your email" required></label>
      <label>Password<input id="registerPassword" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required></label>
      <label>Confirm Password<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" placeholder="Enter password again" required></label>
      <button class="btn primary login-btn" type="submit">Create Account</button>
      <p id="registerMessage" class="message"></p>
    </form>
    <p class="login-subtitle">Already registered? <a href="login.html">Log in</a></p>
  </div>
</main>
<footer><p>© 2026 SmartClass | Smart Classroom Technologies</p></footer>
<script src="script.js"></script>
</body>
</html>
